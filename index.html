<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WallPaperVault | 4K Ultra HD Wallpapers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .watermark-overlay {
            background: repeating-linear-gradient(
                -45deg,
                rgba(255, 255, 255, 0.08),
                rgba(255, 255, 255, 0.08) 15px,
                transparent 15px,
                transparent 30px
            );
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans min-h-screen">

    <!-- Navigation Header -->
    <nav class="flex items-center justify-between px-6 py-4 bg-zinc-900 border-b border-zinc-800 sticky top-0 z-40">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-image text-indigo-500 text-2xl"></i>
            <span class="text-xl font-black tracking-wider text-white">WALLPAPER<span class="text-indigo-500">VAULT</span></span>
        </div>
        <div class="flex items-center space-x-3">
            <span class="text-[10px] bg-indigo-950 text-indigo-400 border border-indigo-800/50 px-2.5 py-1 rounded-full font-mono font-bold uppercase tracking-wider">4K Ultra HD</span>
        </div>
    </nav>

    <!-- Main Content Container -->
    <div class="max-w-7xl mx-auto p-6 space-y-6">

        <!-- ADSTERRA SLOT 2: Top Banner (728x90) -->
        <div class="w-full bg-zinc-900/60 border border-zinc-800/80 rounded-2xl p-3 text-center min-h-[90px] flex flex-col items-center justify-center overflow-hidden">
            <span class="text-[9px] font-mono text-zinc-600 uppercase tracking-widest mb-1">Sponsored</span>
            
            <!-- LIVE ADSTERRA 728x90 BANNER CODE -->
            <script type="text/javascript">
                atOptions = {
                    'key' : 'f103250c47c980b6d62bf87fc131febf',
                    'format' : 'iframe',
                    'height' : 90,
                    'width' : 728,
                    'params' : {}
                };
            </script>
            <script type="text/javascript" src="//www.highperformanceformat.com/f103250c47c980b6d62bf87fc131febf/invoke.js"></script>
        </div>

        <!-- Category & Format Filter Tabs -->
        <div class="flex flex-wrap items-center justify-between gap-4 border-b border-zinc-800 pb-4">
            <div class="flex flex-wrap items-center gap-2">
                <button onclick="filterCategory('all')" id="catAll" class="px-4 py-2 rounded-xl text-xs font-bold bg-indigo-600 text-white transition">All Wallpapers</button>
                <button onclick="filterCategory('boys')" id="catBoys" class="px-4 py-2 rounded-xl text-xs font-bold bg-zinc-900 text-zinc-400 hover:text-white border border-zinc-800 transition">Boys (Cars/Gaming)</button>
                <button onclick="filterCategory('girls')" id="catGirls" class="px-4 py-2 rounded-xl text-xs font-bold bg-zinc-900 text-zinc-400 hover:text-white border border-zinc-800 transition">Girls (Aesthetic/Anime)</button>
            </div>

            <div class="flex items-center space-x-2 bg-zinc-900 p-1 rounded-xl border border-zinc-800">
                <button onclick="filterFormat('all')" id="fmtAll" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-zinc-800 text-white">All Devices</button>
                <button onclick="filterFormat('phone')" id="fmtPhone" class="px-3 py-1.5 rounded-lg text-xs font-bold text-zinc-400 hover:text-white"><i class="fa-solid fa-mobile-screen mr-1"></i> Phone</button>
                <button onclick="filterFormat('pc')" id="fmtPc" class="px-3 py-1.5 rounded-lg text-xs font-bold text-zinc-400 hover:text-white"><i class="fa-solid fa-desktop mr-1"></i> PC Desktop</button>
            </div>
        </div>

        <!-- Wallpaper Gallery Grid -->
        <div id="wallpaperGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>

        <!-- ADSTERRA SLOT 3: Native Banner Container -->
        <div class="w-full bg-zinc-900/60 border border-zinc-800/80 rounded-2xl p-4 text-center min-h-[120px] flex flex-col items-center justify-center my-8">
            <span class="text-[9px] font-mono text-zinc-600 uppercase tracking-widest mb-1">Recommended Content</span>
        </div>
    </div>

    <!-- Payment Modal -->
    <div id="payModal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 rounded-3xl max-w-sm w-full p-6 text-center space-y-5 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="space-y-1">
                <div class="inline-flex items-center space-x-1 text-indigo-400 bg-indigo-500/10 px-3 py-1 rounded-full text-xs font-bold border border-indigo-500/20">
                    <i class="fa-solid fa-lock text-[10px]"></i>
                    <span>Unlock 4K Ultra-HD Original</span>
                </div>
                <h3 id="modalWallTitle" class="text-xl font-bold text-white pt-2">4K Wallpaper</h3>
                <p class="text-xs text-zinc-400">Pay ₹10 via UPI to unlock high-res download</p>
            </div>

            <!-- UPI Payment Details -->
            <div class="bg-zinc-950 p-4 rounded-2xl border border-zinc-800 space-y-3 flex flex-col items-center">
                <img id="upiQrImg" src="" alt="UPI QR" class="w-40 h-40 bg-white p-2 rounded-xl">
                
                <div class="w-full bg-zinc-900 p-2.5 rounded-xl border border-zinc-800 text-center">
                    <span class="text-[10px] text-zinc-400 uppercase tracking-widest block mb-0.5">UPI ID</span>
                    <strong class="text-xs text-indigo-400 font-mono select-all">9431920376@fam</strong>
                </div>

                <a id="upiPayBtn" href="#" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold text-xs py-2.5 rounded-xl transition flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-mobile-screen"></i>
                    <span>1. Pay ₹10 via UPI App</span>
                </a>
            </div>

            <!-- Verification Section -->
            <div class="space-y-3 text-left bg-zinc-950 p-4 rounded-2xl border border-zinc-800">
                <span class="text-[11px] text-zinc-300 font-bold block">2. Verify Payment:</span>
                <input type="text" id="utrInput" maxlength="12" placeholder="Enter 12-digit UTR number" class="w-full bg-zinc-900 border border-zinc-800 text-xs text-white p-3 rounded-xl focus:outline-none focus:border-indigo-500 font-mono">
                
                <button onclick="sendUtrToWhatsapp()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs py-2.5 rounded-xl transition flex items-center justify-center space-x-2">
                    <i class="fa-brands fa-whatsapp text-sm"></i>
                    <span>Send UTR on WhatsApp for Code</span>
                </button>

                <div class="pt-2 border-t border-zinc-800 space-y-2">
                    <label class="text-[10px] text-zinc-400 font-semibold block">3. Enter Passcode Received on WhatsApp:</label>
                    <div class="flex gap-2">
                        <input type="text" id="passcodeInput" placeholder="Enter Code" class="flex-1 bg-zinc-900 border border-zinc-800 text-xs text-white p-2.5 rounded-xl focus:outline-none focus:border-indigo-500 font-mono uppercase">
                        <button onclick="verifyPasscode()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs px-4 rounded-xl transition">Unlock</button>
                    </div>
                </div>
            </div>

            <button onclick="closePayModal()" class="text-xs text-zinc-500 hover:text-white">Cancel</button>
        </div>
    </div>

    <script>
        const UPI_ID = "9431920376@fam";
        const PHONE_NUMBER = "919431920376";

        let activeWallId = null;
        let currentCategory = 'all';
        let currentFormat = 'all';

        // Auto-generate array of 53 wallpapers using reliable Unsplash HD images
        const wallpapers = Array.from({ length: 53 }, (_, i) => {
            const id = i + 1;
            const isBoy = id % 2 !== 0;
            const isPhone = id % 3 === 0;
            
            const category = isBoy ? "boys" : "girls";
            const format = isPhone ? "phone" : "pc";
            const code = `WALL4K_${id}`;
            const price = 10;
            
            // Image collection topics matching categories
            const term = isBoy ? 'supercar,gaming,cyberpunk' : 'aesthetic,anime,nature';
            const img = `https://source.unsplash.com/featured/${isPhone ? '1080x1920' : '1920x1080'}?${term}&sig=${id}`;

            let title = `4K Ultra HD Wallpaper #${id}`;
            if (id === 1) title = "BMW M4 Competition Dark";
            if (id === 2) title = "Neon Cyberpunk Aesthetic";
            if (id === 3) title = "BMW M5 Supercar Night";

            return { id, title, category, format, price, code, img };
        });

        function isUnlocked(id) {
            return localStorage.getItem(`unlocked_wall_${id}`) === 'true';
        }

        function renderGallery() {
            const grid = document.getElementById('wallpaperGrid');
            if (!grid) return;

            const filtered = wallpapers.filter(w => {
                const matchCat = currentCategory === 'all' || w.category === currentCategory;
                const matchFmt = currentFormat === 'all' || w.format === currentFormat;
                return matchCat && matchFmt;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center text-zinc-500 py-12 text-sm">No wallpapers found in this category.</div>';
                return;
            }

            let htmlOutput = '';
            filtered.forEach((w) => {
                const unlocked = isUnlocked(w.id);
                htmlOutput += `
                    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden group flex flex-col justify-between">
                        <div class="relative ${w.format === 'phone' ? 'aspect-[9/16]' : 'aspect-video'} bg-zinc-950 overflow-hidden">
                            <img src="${w.img}" alt="${w.title}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                            ${!unlocked ? `
                                <div class="absolute inset-0 watermark-overlay flex flex-col items-center justify-center p-4 text-center">
                                    <span class="bg-black/70 backdrop-blur-md text-white font-extrabold text-[10px] px-3 py-1 rounded-full border border-white/20 uppercase tracking-widest mb-1">
                                        <i class="fa-solid fa-lock mr-1"></i> Preview Only
                                    </span>
                                </div>
                            ` : `
                                <div class="absolute top-3 right-3 bg-indigo-600 text-white text-[10px] font-extrabold px-2.5 py-1 rounded-full shadow-lg">
                                    <i class="fa-solid fa-circle-check mr-1"></i> Unlocked
                                </div>
                            `}
                        </div>

                        <div class="p-4 space-y-3">
                            <div class="flex items-start justify-between gap-2">
                                <div>
                                    <h3 class="text-xs font-bold text-white">${w.title}</h3>
                                    <span class="text-[10px] text-zinc-500 uppercase font-mono tracking-wider">${w.category} • ${w.format.toUpperCase()}</span>
                                </div>
                                <span class="text-xs font-black text-indigo-400">₹${w.price}</span>
                            </div>

                            ${unlocked ? `
                                <a href="${w.img}" download="${w.title}-4K.jpg" target="_blank" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs py-2.5 rounded-xl transition flex items-center justify-center space-x-2">
                                    <i class="fa-solid fa-download"></i>
                                    <span>Download 4K Image</span>
                                </a>
                            ` : `
                                <button onclick="openPayModal(${w.id})" class="w-full bg-zinc-800 hover:bg-indigo-600 text-white font-bold text-xs py-2.5 rounded-xl transition border border-zinc-700 flex items-center justify-center space-x-2">
                                    <i class="fa-solid fa-lock text-indigo-400"></i>
                                    <span>Unlock Full Resolution</span>
                                </button>
                            `}
                        </div>
                    </div>
                `;
            });

            grid.innerHTML = htmlOutput;
        }

        function filterCategory(cat) {
            currentCategory = cat;
            renderGallery();
        }

        function filterFormat(fmt) {
            currentFormat = fmt;
            renderGallery();
        }

        function openPayModal(id) {
            const wall = wallpapers.find(w => w.id === id);
            if (!wall) return;
            activeWallId = id;

            document.getElementById('modalWallTitle').innerText = wall.title;
            const upiUrl = `upi://pay?pa=${UPI_ID}&pn=WallPaperVault&am=${wall.price}&cu=INR&tn=Unlock_${wall.code}`;
            
            document.getElementById('upiQrImg').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(upiUrl)}`;
            document.getElementById('upiPayBtn').href = upiUrl;

            document.getElementById('payModal').classList.remove('hidden');
        }

        function closePayModal() {
            document.getElementById('payModal').classList.add('hidden');
            activeWallId = null;
        }

        function sendUtrToWhatsapp() {
            const utr = document.getElementById('utrInput').value.trim();
            if (utr.length !== 12 || isNaN(utr)) {
                alert("Please enter a valid 12-digit UTR number.");
                return;
            }
            const wall = wallpapers.find(w => w.id === activeWallId);
            const msg = `Hi! I paid ₹${wall.price} for wallpaper '${wall.title}' (Code: ${wall.code}). My UTR is ${utr}. Please send me the unlock passcode.`;
            window.open(`https://wa.me/${PHONE_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function verifyPasscode() {
            const enteredCode = document.getElementById('passcodeInput').value.trim().toUpperCase();
            const wall = wallpapers.find(w => w.id === activeWallId);
            if (wall && enteredCode === wall.code) {
                localStorage.setItem(`unlocked_wall_${wall.id}`, 'true');
                alert("Success! Wallpaper unlocked.");
                closePayModal();
                renderGallery();
            } else {
                alert("Incorrect passcode.");
            }
        }

        renderGallery();
    </script>
</body>
</html>
