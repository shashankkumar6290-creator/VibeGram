<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeGram</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #fafafa;
            color: #262626;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .hidden {
            display: none !important;
        }

        /* App Container */
        #app {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 850px;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            overflow: hidden;
            border-radius: 12px;
        }

        @media (max-width: 480px) {
            #app {
                height: 100vh;
                max-height: 100vh;
                border-radius: 0;
            }
        }

        /* Auth Screen */
        .auth-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-align: center;
            background: #fff;
        }

        .auth-container h1 {
            font-family: 'Brush Script MT', cursive, sans-serif;
            font-size: 48px;
            margin-bottom: 24px;
            color: #0095f6;
        }

        .auth-container input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #dbdbdb;
            border-radius: 6px;
            background: #fafafa;
            font-size: 14px;
        }

        .auth-container button {
            width: 100%;
            padding: 12px;
            background: #0095f6;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
        }

        .auth-container button:hover {
            background: #1877f2;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #dbdbdb;
            background: #fff;
            height: 50px;
        }

        header .logo {
            font-family: 'Brush Script MT', cursive, sans-serif;
            font-size: 26px;
            font-weight: bold;
            color: #262626;
        }

        header .header-icons span {
            font-size: 22px;
            margin-left: 16px;
            cursor: pointer;
        }

        /* Main Content Body */
        .content-body {
            flex: 1;
            overflow-y: auto;
            background: #fafafa;
            padding-bottom: 60px;
        }

        /* Stories Bar */
        .stories-bar {
            display: flex;
            padding: 12px;
            background: #fff;
            border-bottom: 1px solid #dbdbdb;
            overflow-x: auto;
            gap: 16px;
        }

        .story-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            min-width: 68px;
        }

        .story-ring {
            width: 66px;
            height: 66px;
            border-radius: 50%;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2px;
        }

        .story-ring.seen {
            background: #dbdbdb;
        }

        .story-thumb {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #fff;
            background: #efefef;
        }

        .story-item span {
            font-size: 11px;
            margin-top: 4px;
            max-width: 68px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Feed Posts */
        .post {
            background: #fff;
            margin-bottom: 16px;
            border-bottom: 1px solid #dbdbdb;
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
        }

        .post-user {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 14px;
        }

        .post-user img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
        }

        .post-media {
            width: 100%;
            max-height: 450px;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .post-media img, .post-media video {
            width: 100%;
            max-height: 450px;
            object-fit: contain;
        }

        .post-actions {
            display: flex;
            justify-content: space-between;
            padding: 10px 16px;
            font-size: 22px;
        }

        .post-actions div span {
            cursor: pointer;
            margin-right: 14px;
        }

        .post-likes {
            padding: 0 16px;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .post-caption {
            padding: 0 16px;
            font-size: 14px;
            margin-bottom: 6px;
        }

        .post-caption span {
            font-weight: 600;
            margin-right: 6px;
        }

        .post-comments-section {
            padding: 0 16px 12px 16px;
        }

        .comment-item {
            font-size: 13px;
            margin-bottom: 4px;
        }

        .comment-item b {
            margin-right: 6px;
        }

        .comment-input-box {
            display: flex;
            border-top: 1px solid #efefef;
            padding: 8px 16px;
        }

        .comment-input-box input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 13px;
        }

        .comment-input-box button {
            background: none;
            border: none;
            color: #0095f6;
            font-weight: 600;
            cursor: pointer;
        }

        /* Bottom Nav */
        nav.bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: #fff;
            border-top: 1px solid #dbdbdb;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 10;
        }

        nav.bottom-nav span {
            font-size: 24px;
            cursor: pointer;
        }

        /* Modals / Screens */
        .modal-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            z-index: 20;
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            border-bottom: 1px solid #dbdbdb;
            font-weight: 600;
        }

        .modal-header span {
            cursor: pointer;
            color: #0095f6;
        }

        .modal-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        /* Reels View */
        .reels-container {
            flex: 1;
            background: #000;
            position: relative;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
        }

        .reel-item {
            width: 100%;
            height: 100%;
            scroll-snap-align: start;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .reel-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .reel-overlay {
            position: absolute;
            bottom: 60px;
            left: 16px;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        /* Direct Messages */
        .chat-list-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            gap: 12px;
            cursor: pointer;
            border-bottom: 1px solid #efefef;
        }

        .chat-list-item img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
        }

        /* Story Viewer Modal */
        #story-viewer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 30;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }
    </style>
</head>
<body>

<div id="app">
    <!-- AUTHENTICATION SCREEN -->
    <div id="auth-screen" class="auth-container">
        <h1>VibeGram</h1>
        <p style="margin-bottom: 20px; color: #8e8e8e; font-size: 14px;">Log in with your phone number and username</p>
        <input type="text" id="auth-username" placeholder="Username">
        <input type="tel" id="auth-phone" placeholder="Mobile Number">
        <button onclick="handleLogin()">Log In / Sign Up</button>
    </div>

    <!-- MAIN APP SCREEN -->
    <div id="main-app" class="hidden" style="display:flex; flex-direction:column; height:100%; width:100%; position:relative;">
        <header>
            <div class="logo">VibeGram</div>
            <div class="header-icons">
                <span onclick="openCreateModal()">➕</span>
                <span onclick="openMessages()">💬</span>
            </div>
        </header>

        <div class="content-body" id="feed-container">
            <!-- Stories Bar & Posts Feed injected dynamically -->
        </div>

        <!-- BOTTOM NAVIGATION -->
        <nav class="bottom-nav">
            <span onclick="switchTab('feed')">🏠</span>
            <span onclick="switchTab('reels')">🎬</span>
            <span onclick="openExplore()">🔍</span>
            <span onclick="openNotesModal()">📝</span>
            <span onclick="openProfile()">👤</span>
            <span id="admin-nav-icon" class="hidden" onclick="openAdminPanel()">🛡️</span>
        </nav>
    </div>

    <!-- CREATE POST / REEL / STORY MODAL -->
    <div id="create-modal" class="modal-screen hidden">
        <div class="modal-header">
            <span onclick="closeCreateModal()">Cancel</span>
            <b>Create New</b>
            <span onclick="submitCreate()">Share</span>
        </div>
        <div class="modal-content">
            <select id="create-type" style="width:100%; padding:10px; margin-bottom:15px; border-radius:6px; border:1px solid #dbdbdb;">
                <option value="post">Post (Photo/Video)</option>
                <option value="reel">Reel (Video)</option>
                <option value="story">Story (Photo/Video)</option>
            </select>
            <label style="display:block; margin-bottom:8px; font-weight:600;">Select from Gallery:</label>
            <input type="file" id="media-file-input" accept="image/*,video/*" style="margin-bottom:15px; width:100%;">
            <textarea id="create-caption" placeholder="Write a caption..." style="width:100%; height:80px; padding:10px; border-radius:6px; border:1px solid #dbdbdb; resize:none;"></textarea>
        </div>
    </div>

    <!-- EXPLORE / USERS LIST MODAL -->
    <div id="explore-modal" class="modal-screen hidden">
        <div class="modal-header">
            <span onclick="closeExplore()">Close</span>
            <b>Discover Accounts</b>
            <span></span>
        </div>
        <div class="modal-content" id="explore-users-list">
            <!-- Users list to follow/unfollow -->
        </div>
    </div>

    <!-- MESSAGES / CHATS MODAL -->
    <div id="messages-modal" class="modal-screen hidden">
        <div class="modal-header">
            <span onclick="closeMessages()">Back</span>
            <b id="chat-header-title">Messages</b>
            <span onclick="openNewGroupModal()">New Group</span>
        </div>
        <div class="modal-content" id="messages-content" style="padding:0;">
            <!-- Chat list -->
        </div>
    </div>

    <!-- NOTES MODAL -->
    <div id="notes-modal" class="modal-screen hidden">
        <div class="modal-header">
            <span onclick="closeNotesModal()">Close</span>
            <b>Notes</b>
            <span onclick="saveNote()">Post</span>
        </div>
        <div class="modal-content">
            <input type="text" id="note-input" placeholder="Share what's on your mind..." maxlength="60" style="width:100%; padding:12px; border:1px solid #dbdbdb; border-radius:6px; margin-bottom:15px;">
            <div id="notes-list"></div>
        </div>
    </div>

    <!-- ADMIN PANEL MODAL -->
    <div id="admin-panel" class="modal-screen hidden">
        <div class="modal-header">
            <span onclick="closeAdminPanel()">Close</span>
            <b>Admin Moderation</b>
            <span></span>
        </div>
        <div class="modal-content" id="admin-reports-list"></div>
    </div>

    <!-- STORY VIEWER -->
    <div id="story-viewer" class="hidden" onclick="closeStoryViewer()">
        <div style="position:absolute; top:20px; left:20px; font-weight:600;" id="story-viewer-user">User</div>
        <div id="story-viewer-media-container" style="display:flex; justify-content:center; align-items:center; width:100%; height:100%;"></div>
    </div>
</div>

<script>
    let currentUser = JSON.parse(localStorage.getItem('vb_current_user')) || null;
    let users = JSON.parse(localStorage.getItem('vb_users')) || [];
    let posts = JSON.parse(localStorage.getItem('vb_posts')) || [];
    let stories = JSON.parse(localStorage.getItem('vb_stories')) || [];
    let reels = JSON.parse(localStorage.getItem('vb_reels')) || [];
    let notes = JSON.parse(localStorage.getItem('vb_notes')) || [];
    let reports = JSON.parse(localStorage.getItem('vb_reports')) || [];
    let chats = JSON.parse(localStorage.getItem('vb_chats')) || [];

    function cleanExpiredStories() {
        const now = Date.now();
        const twentyFourHours = 24 * 60 * 60 * 1000;
        stories = stories.filter(s => (now - s.timestamp) < twentyFourHours);
        localStorage.setItem('vb_stories', JSON.stringify(stories));
    }

    window.onload = function() {
        cleanExpiredStories();
        if (currentUser) {
            // Sync currentUser state with users list
            let found = users.find(u => u.username === currentUser.username);
            if(found) {
                currentUser = found;
            } else {
                users.push(currentUser);
                localStorage.setItem('vb_users', JSON.stringify(users));
            }
            startAppSession();
        }
    };

    function handleLogin() {
        let username = document.getElementById('auth-username').value.trim();
        let phone = document.getElementById('auth-phone').value.trim();
        if(!username || !phone) {
            alert('Please enter both username and mobile number.');
            return;
        }

        let user = users.find(u => u.username === username);
        if(!user) {
            user = { username, phone, following: [], followers: [], blocked: [] };
            users.push(user);
            localStorage.setItem('vb_users', JSON.stringify(users));
        }

        currentUser = user;
        localStorage.setItem('vb_current_user', JSON.stringify(currentUser));
        startAppSession();
    }

    function startAppSession() {
        document.getElementById('auth-screen').classList.add('hidden');
        document.getElementById('main-app').classList.remove('hidden');
        if(currentUser.username === 'admin') {
            document.getElementById('admin-nav-icon').classList.remove('hidden');
        }
        renderFeed();
    }

    function switchTab(tab) {
        if(tab === 'feed') {
            renderFeed();
        } else if(tab === 'reels') {
            renderReels();
        }
    }

    function openCreateModal() {
        document.getElementById('create-modal').classList.remove('hidden');
    }

    function closeCreateModal() {
        document.getElementById('create-modal').classList.add('hidden');
    }

    function submitCreate() {
        let type = document.getElementById('create-type').value;
        let fileInput = document.getElementById('media-file-input');
        let caption = document.getElementById('create-caption').value;

        if(fileInput.files.length === 0) {
            alert('Please select a file from your gallery.');
            return;
        }

        let file = fileInput.files[0];
        let reader = new FileReader();

        reader.onload = function(e) {
            let mediaUrl = e.target.result;

            if(type === 'post') {
                let newPost = {
                    id: Date.now(),
                    username: currentUser.username,
                    mediaUrl: mediaUrl,
                    mediaType: file.type.startsWith('video') ? 'video' : 'image',
                    caption: caption,
                    likes: [],
                    comments: []
                };
                posts.unshift(newPost);
                localStorage.setItem('vb_posts', JSON.stringify(posts));
                renderFeed();
            } else if(type === 'reel') {
                let newReel = {
                    id: Date.now(),
                    username: currentUser.username,
                    mediaUrl: mediaUrl,
                    caption: caption,
                    likes: []
                };
                reels.unshift(newReel);
                localStorage.setItem('vb_reels', JSON.stringify(reels));
            } else if(type === 'story') {
                let newStory = {
                    id: Date.now(),
                    username: currentUser.username,
                    mediaUrl: mediaUrl,
                    timestamp: Date.now()
                };
                stories.push(newStory);
                localStorage.setItem('vb_stories', JSON.stringify(stories));
                renderFeed();
            }

            fileInput.value = '';
            document.getElementById('create-caption').value = '';
            closeCreateModal();
            alert('Uploaded successfully!');
        };

        reader.readAsDataURL(file);
    }

    function renderFeed() {
        cleanExpiredStories();
        let container = document.getElementById('feed-container');
        container.innerHTML = `
            <div class="stories-bar" id="stories-bar">
                <div class="story-item" onclick="openCreateStory()">
                    <div class="story-ring seen" style="border: 2px dashed #dbdbdb;">
                        <img src="https://via.placeholder.com/60" class="story-thumb">
                    </div>
                    <span>Your Story</span>
                </div>
            </div>
            <div id="posts-feed"></div>
        `;
        renderStories();

        let postsDiv = document.getElementById('posts-feed');
        // Users can see their own posts and posts from users they follow
        let visiblePosts = posts.filter(p => p.username === currentUser.username || (currentUser.following && currentUser.following.includes(p.username)));

        if(visiblePosts.length === 0) {
            postsDiv.innerHTML = `<div style="text-align:center; padding:40px; color:#8e8e8e;">Your feed is empty. Follow users via the 🔍 Explore tab or add your own post!</div>`;
            return;
        }

        visiblePosts.forEach(post => {
            let isLiked = post.likes.includes(currentUser.username);
            let postEl = document.createElement('div');
            postEl.className = 'post';
            postEl.innerHTML = `
                <div class="post-header">
                    <div class="post-user">
                        <img src="https://via.placeholder.com/32" alt="">
                        <span>${post.username}</span>
                    </div>
                    <span style="cursor:pointer;" onclick="reportPost(${post.id})">⋮</span>
                </div>
                <div class="post-media">
                    ${post.mediaType === 'video' ? `<video src="${post.mediaUrl}" controls></video>` : `<img src="${post.mediaUrl}" alt="">`}
                </div>
                <div class="post-actions">
                    <div>
                        <span onclick="likePost(${post.id})">${isLiked ? '❤️' : '🤍'}</span>
                        <span onclick="focusComment(${post.id})">💬</span>
                    </div>
                    <span onclick="blockUser('${post.username}')" style="font-size:14px; color:#ed4956; cursor:pointer;">Block</span>
                </div>
                <div class="post-likes">${post.likes.length} likes</div>
                <div class="post-caption"><span>${post.username}</span>${post.caption}</div>
                <div class="post-comments-section" id="comments-${post.id}">
                    ${post.comments.map(c => `<div class="comment-item"><b>${c.user}</b>${c.text}</div>`).join('')}
                </div>
                <div class="comment-input-box">
                    <input type="text" id="comment-input-${post.id}" placeholder="Add a comment...">
                    <button onclick="addComment(${post.id})">Post</button>
                </div>
            `;
            postsDiv.appendChild(postEl);
        });
    }

    function renderStories() {
        let bar = document.getElementById('stories-bar');
        if(!bar) return;
        
        let uniqueUsers = [...new Set(stories.map(s => s.username))];
        uniqueUsers.forEach(username => {
            if(username === currentUser.username || (currentUser.following && currentUser.following.includes(username))) {
                let userStories = stories.filter(s => s.username === username);
                if(userStories.length > 0) {
                    let item = document.createElement('div');
                    item.className = 'story-item';
                    item.onclick = () => viewUserStories(username);
                    item.innerHTML = `
                        <div class="story-ring">
                            <img src="https://via.placeholder.com/60" class="story-thumb">
                        </div>
                        <span>${username}</span>
                    `;
                    bar.appendChild(item);
                }
            }
        });
    }

    function viewUserStories(username) {
        let userStories = stories.filter(s => s.username === username);
        if(userStories.length === 0) return;

        let viewer = document.getElementById('story-viewer');
        let mediaContainer = document.getElementById('story-viewer-media-container');
        document.getElementById('story-viewer-user').innerText = username;

        function showStory(idx) {
            if(idx >= userStories.length) {
                closeStoryViewer();
                return;
            }
            let s = userStories[idx];
            mediaContainer.innerHTML = s.mediaUrl.startsWith('data:video') ? `<video src="${s.mediaUrl}" autoplay controls></video>` : `<img src="${s.mediaUrl}">`;
            
            setTimeout(() => {
                showStory(idx + 1);
            }, 5000);
        }

        viewer.classList.remove('hidden');
        showStory(0);
    }

    function closeStoryViewer() {
        document.getElementById('story-viewer').classList.add('hidden');
    }

    function openCreateStory() {
        document.getElementById('create-type').value = 'story';
        openCreateModal();
    }

    function openExplore() {
        document.getElementById('explore-modal').classList.remove('hidden');
        let list = document.getElementById('explore-users-list');
        list.innerHTML = '';

        let otherUsers = users.filter(u => u.username !== currentUser.username);
        if(otherUsers.length === 0) {
            list.innerHTML = `<p style="text-align:center; color:#8e8e8e;">No other users registered yet.</p>`;
            return;
        }

        otherUsers.forEach(u => {
            let isFollowing = currentUser.following && currentUser.following.includes(u.username);
            list.innerHTML += `
                <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #efefef;">
                    <div style="display:flex; align-items:center; gap:10px;">
                        <img src="https://via.placeholder.com/40" style="border-radius:50%;">
                        <b>${u.username}</b>
                    </div>
                    <button onclick="toggleFollow('${u.username}')" style="background:${isFollowing ? '#dbdbdb' : '#0095f6'}; color:${isFollowing ? '#262626' : '#fff'}; border:none; padding:6px 16px; border-radius:4px; font-weight:600; cursor:pointer;">
                        ${isFollowing ? 'Following' : 'Follow'}
                    </button>
                </div>
            `;
        });
    }

    function closeExplore() {
        document.getElementById('explore-modal').classList.add('hidden');
        renderFeed();
    }

    function toggleFollow(username) {
        if(!currentUser.following) currentUser.following = [];
        let idx = currentUser.following.indexOf(username);
        if(idx > -1) {
            currentUser.following.splice(idx, 1);
        } else {
            currentUser.following.push(username);
        }

        // Update in global users list
        let targetUser = users.find(u => u.username === username);
        if(targetUser) {
            if(!targetUser.followers) targetUser.followers = [];
            let fIdx = targetUser.followers.indexOf(currentUser.username);
            if(idx > -1 && fIdx > -1) targetUser.followers.splice(fIdx, 1);
            else if(idx === -1 && fIdx === -1) targetUser.followers.push(currentUser.username);
        }

        localStorage.setItem('vb_current_user', JSON.stringify(currentUser));
        localStorage.setItem('vb_users', JSON.stringify(users));
        openExplore();
    }

    function likePost(postId) {
        let post = posts.find(p => p.id === postId);
        if(!post) return;
        let idx = post.likes.indexOf(currentUser.username);
        if(idx > -1) {
            post.likes.splice(idx, 1);
        } else {
            post.likes.push(currentUser.username);
        }
        localStorage.setItem('vb_posts', JSON.stringify(posts));
        renderFeed();
    }

    function addComment(postId) {
        let input = document.getElementById(`comment-input-${postId}`);
        let text = input.value.trim();
        if(!text) return;

        let post = posts.find(p => p.id === postId);
        if(post) {
            post.comments.push({ user: currentUser.username, text: text });
            localStorage.setItem('vb_posts', JSON.stringify(posts));
            renderFeed();
        }
    }

    function reportPost(postId) {
        let reason = prompt("Enter reason for reporting this post:");
        if(reason) {
            reports.push({ id: Date.now(), type: 'post', contentId: postId, reporter: currentUser.username, reason: reason });
            localStorage.setItem('vb_reports', JSON.stringify(reports));
            alert('Report submitted for admin review.');
        }
    }

    function blockUser(username) {
        if(confirm(`Block ${username}?`)) {
            if(!currentUser.blocked) currentUser.blocked = [];
            currentUser.blocked.push(username);
            localStorage.setItem('vb_current_user', JSON.stringify(currentUser));
            alert('User blocked.');
            renderFeed();
        }
    }

    function renderReels() {
        let container = document.getElementById('feed-container');
        if(reels.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding:40px; color:#fff; background:#000; height:100%;">No reels available.</div>`;
            return;
        }

        container.innerHTML = `<div class="reels-container" id="reels-box"></div>`;
        let box = document.getElementById('reels-box');

        reels.forEach(reel => {
            let div = document.createElement('div');
            div.className = 'reel-item';
            div.innerHTML = `
                <video src="${reel.mediaUrl}" loop autoplay muted></video>
                <div class="reel-overlay">
                    <b>@${reel.username}</b>
                    <p>${reel.caption || ''}</p>
                </div>
            `;
            box.appendChild(div);
        });
    }

    function openMessages() {
        document.getElementById('messages-modal').classList.remove('hidden');
        renderChatList();
    }

    function closeMessages() {
        document.getElementById('messages-modal').classList.add('hidden');
    }

    function renderChatList() {
        let content = document.getElementById('messages-content');
        content.innerHTML = `<div id="chat-users-list"></div>`;
        let list = document.getElementById('chat-users-list');
        users.forEach(u => {
            if(u.username !== currentUser.username) {
                list.innerHTML += `
                    <div class="chat-list-item" onclick="openChatWith('${u.username}')">
                        <img src="https://via.placeholder.com/50">
                        <div><b>${u.username}</b><p style="font-size:12px; color:#8e8e8e;">Tap to chat</p></div>
                    </div>
                `;
            }
        });
    }

    function openChatWith(username) {
        let chatKey = [currentUser.username, username].sort().join('_');
        let chat = chats.find(c => c.key === chatKey) || { key: chatKey, messages: [] };

        let content = document.getElementById('messages-content');
        document.getElementById('chat-header-title').innerText = username;

        content.innerHTML = `
            <div id="chat-messages" style="flex:1; overflow-y:auto; padding:15px; display:flex; flex-direction:column; gap:10px; max-height:65vh;"></div>
            <div style="display:flex; padding:10px; border-top:1px solid #dbdbdb; background:#fff;">
                <input type="text" id="chat-msg-input" placeholder="Message..." style="flex:1; padding:10px; border:1px solid #dbdbdb; border-radius:20px; outline:none;">
                <button onclick="sendChatMessage('${chatKey}')" style="background:none; border:none; color:#0095f6; font-weight:600; margin-left:10px; cursor:pointer;">Send</button>
            </div>
        `;

        renderChatMessages(chat);
    }

    function renderChatMessages(chat) {
        let box = document.getElementById('chat-messages');
        if(!box) return;
        box.innerHTML = chat.messages.map(m => `
            <div style="align-self: ${m.sender === currentUser.username ? 'flex-end' : 'flex-start'}; background:#efefef; padding:8px 12px; border-radius:12px; max-width:70%;">
                <span style="font-size:13px;">${m.text}</span>
            </div>
        `).join('');
        box.scrollTop = box.scrollHeight;
    }

    function sendChatMessage(chatKey) {
        let input = document.getElementById('chat-msg-input');
        let text = input.value.trim();
        if(!text) return;

        let chat = chats.find(c => c.key === chatKey);
        if(!chat) {
            chat = { key: chatKey, messages: [] };
            chats.push(chat);
        }

        chat.messages.push({ sender: currentUser.username, text: text });
        localStorage.setItem('vb_chats', JSON.stringify(chats));
        input.value = '';
        renderChatMessages(chat);
    }

    function openNewGroupModal() {
        let groupName = prompt("Enter Group Name:");
        if(groupName) {
            let chatKey = 'group_' + Date.now();
            chats.push({ key: chatKey, name: groupName, messages: [] });
            localStorage.setItem('vb_chats', JSON.stringify(chats));
            alert('Group created successfully!');
            renderChatList();
        }
    }

    function openNotesModal() {
        document.getElementById('notes-modal').classList.remove('hidden');
        renderNotes();
    }

    function closeNotesModal() {
        document.getElementById('notes-modal').classList.add('hidden');
    }

    function saveNote() {
        let text = document.getElementById('note-input').value.trim();
        if(!text) return;
        notes.push({ username: currentUser.username, text: text, time: Date.now() });
        localStorage.setItem('vb_notes', JSON.stringify(notes));
        document.getElementById('note-input').value = '';
        renderNotes();
    }

    function renderNotes() {
        let list = document.getElementById('notes-list');
        list.innerHTML = notes.map(n => `
            <div style="background:#efefef; padding:10px; border-radius:8px; margin-bottom:8px;">
                <b>@${n.username}</b>: <span style="font-size:14px;">${n.text}</span>
            </div>
        `).join('');
    }

    function openAdminPanel() {
        document.getElementById('admin-panel').classList.remove('hidden');
        let list = document.getElementById('admin-reports-list');
        if(reports.length === 0) {
            list.innerHTML = `<p>No pending reports.</p>`;
            return;
        }

        list.innerHTML = reports.map(r => `
            <div style="border:1px solid #dbdbdb; padding:12px; border-radius:6px; margin-bottom:10px;">
                <p><b>Type:</b> ${r.type}</p>
                <p><b>Reporter:</b> ${r.reporter}</p>
                <p><b>Reason:</b> ${r.reason}</p>
                <button onclick="resolveReport(${r.id}, true)" style="background:#ed4956; color:white; border:none; padding:6px 12px; border-radius:4px; margin-top:6px; cursor:pointer;">Remove Content</button>
                <button onclick="resolveReport(${r.id}, false)" style="background:#dbdbdb; border:none; padding:6px 12px; border-radius:4px; margin-top:6px; cursor:pointer; margin-left:6px;">Dismiss</button>
            </div>
        `).join('');
    }

    function closeAdminPanel() {
        document.getElementById('admin-panel').classList.add('hidden');
    }

    function resolveReport(reportId, remove) {
        let report = reports.find(r => r.id === reportId);
        if(report && remove) {
            posts = posts.filter(p => p.id !== report.contentId);
            localStorage.setItem('vb_posts', JSON.stringify(posts));
        }
        reports = reports.filter(r => r.id !== reportId);
        localStorage.setItem('vb_reports', JSON.stringify(reports));
        openAdminPanel();
        renderFeed();
    }

    function openProfile() {
        alert(`Logged in as @${currentUser.username}\nFollowing: ${(currentUser.following || []).length}\nFollowers: ${(currentUser.followers || []).length}`);
    }
</script>
</body>
</html>
