
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WallPaperVault | 4K Ultra HD Wallpapers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .watermark-overlay {
            background: repeating-linear-gradient(
                -45deg,
                rgba(255, 255, 255, 0.08),
                rgba(255, 255, 255, 0.08) 15px,
                transparent 15px,
                transparent 30px
            );
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans min-h-screen">

    <!-- Navigation Header -->
    <nav class="flex items-center justify-between px-6 py-4 bg-zinc-900 border-b border-zinc-800 sticky top-0 z-40">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-image text-indigo-500 text-2xl"></i>
            <span class="text-xl font-black tracking-wider text-white">WALLPAPER<span class="text-indigo-500">VAULT</span></span>
        </div>
        <div class="flex items-center space-x-3">
            <span class="text-[10px] bg-indigo-950 text-indigo-400 border border-indigo-800/50 px-2.5 py-1 rounded-full font-mono font-bold uppercase tracking-wider">4K Ultra HD</span>
        </div>
    </nav>

    <!-- Main Content Container -->
    <div class="max-w-7xl mx-auto p-6 space-y-6">

        <!-- Category & Format Filter Tabs -->
        <div class="flex flex-wrap items-center justify-between gap-4 border-b border-zinc-800 pb-4">
            <div class="flex flex-wrap items-center gap-2">
                <button onclick="filterCategory('all')" id="catAll" class="px-4 py-2 rounded-xl text-xs font-bold bg-indigo-600 text-white transition">All Wallpapers</button>
                <button onclick="filterCategory('boys')" id="catBoys" class="px-4 py-2 rounded-xl text-xs font-bold bg-zinc-900 text-zinc-400 hover:text-white border border-zinc-800 transition">Boys (Cars/Gaming)</button>
                <button onclick="filterCategory('girls')" id="catGirls" class="px-4 py-2 rounded-xl text-xs font-bold bg-zinc-900 text-zinc-400 hover:text-white border border-zinc-800 transition">Girls (Aesthetic/Anime)</button>
            </div>

            <div class="flex items-center space-x-2 bg-zinc-900 p-1 rounded-xl border border-zinc-800">
                <button onclick="filterFormat('all')" id="fmtAll" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-zinc-800 text-white">All Devices</button>
                <button onclick="filterFormat('phone')" id="fmtPhone" class="px-3 py-1.5 rounded-lg text-xs font-bold text-zinc-400 hover:text-white"><i class="fa-solid fa-mobile-screen mr-1"></i> Phone</button>
                <button onclick="filterFormat('pc')" id="fmtPc" class="px-3 py-1.5 rounded-lg text-xs font-bold text-zinc-400 hover:text-white"><i class="fa-solid fa-desktop mr-1"></i> PC Desktop</button>
            </div>
        </div>

        <!-- Wallpaper Gallery Grid -->
        <div id="wallpaperGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
    </div>

    <!-- Payment Modal -->
    <div id="payModal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 rounded-3xl max-w-sm w-full p-6 text-center space-y-5 shadow-2xl">
            <div class="space-y-1">
                <div class="inline-flex items-center space-x-1 text-indigo-400 bg-indigo-500/10 px-3 py-1 rounded-full text-xs font-bold border border-indigo-500/20">
                    <i class="fa-solid fa-lock text-[10px]"></i>
                    <span>Unlock 4K Ultra-HD Original</span>
                </div>
                <h3 id="modalWallTitle" class="text-xl font-bold text-white pt-2">4K Wallpaper</h3>
                <p class="text-xs text-zinc-400">Pay ₹10 via UPI to unlock high-res download</p>
            </div>

            <!-- UPI Payment Details -->
            <div class="bg-zinc-950 p-4 rounded-2xl border border-zinc-800 space-y-3 flex flex-col items-center">
                <img id="upiQrImg" src="" alt="UPI QR" class="w-40 h-40 bg-white p-2 rounded-xl">
                
                <div class="w-full bg-zinc-900 p-2.5 rounded-xl border border-zinc-800 text-center">
                    <span class="text-[10px] text-zinc-400 uppercase tracking-widest block mb-0.5">UPI ID</span>
                    <strong class="text-xs text-indigo-400 font-mono select-all">9431920376@fam</strong>
                </div>

                <a id="upiPayBtn" href="#" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold text-xs py-2.5 rounded-xl transition flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-mobile-screen"></i>
                    <span>1. Pay ₹10 via UPI App</span>
                </a>
            </div>

            <!-- Verification Section -->
            <div class="space-y-3 text-left bg-zinc-950 p-4 rounded-2xl border border-zinc-800">
                <span class="text-[11px] text-zinc-300 font-bold block">2. Verify Payment:</span>
                <input type="text" id="utrInput" maxlength="12" placeholder="Enter 12-digit UTR number" class="w-full bg-zinc-900 border border-zinc-800 text-xs text-white p-3 rounded-xl focus:outline-none focus:border-indigo-500 font-mono">
                
                <button onclick="sendUtrToWhatsapp()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs py-2.5 rounded-xl transition flex items-center justify-center space-x-2">
                    <i class="fa-brands fa-whatsapp text-sm"></i>
                    <span>Send UTR on WhatsApp for Code</span>
                </button>

                <div class="pt-2 border-t border-zinc-800 space-y-2">
                    <label class="text-[10px] text-zinc-400 font-semibold block">3. Enter Passcode Received on WhatsApp:</label>
                    <div class="flex gap-2">
                        <input type="text" id="passcodeInput" placeholder="Enter Code" class="flex-1 bg-zinc-900 border border-zinc-800 text-xs text-white p-2.5 rounded-xl focus:outline-none focus:border-indigo-500 font-mono uppercase">
                        <button onclick="verifyPasscode()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs px-4 rounded-xl transition">Unlock</button>
                    </div>
                </div>
            </div>

            <button onclick="closePayModal()" class="text-xs text-zinc-500 hover:text-white">Cancel</button>
        </div>
    </div>

    <script>
        const UPI_ID = "9431920376@fam";
        const PHONE_NUMBER = "919431920376";

        let activeWallId = null;
        let currentCategory = 'all';
        let currentFormat = 'all';

        // Catalog: 27 Wallpapers with Unique Unlock Codes
        const wallpapers = [
            // --- Custom Upload Wallpaper (Direct HD Link) ---
            { id: 29, title: "Aesthetic Girl Edition", category: "girls", format: "phone", price: 10, code: "GIRLVAL", img: "https://i.ibb.co/xtJg3FzY/wallpaper.jpg" },

            // --- Original Gallery ---
            { id: 1, title: "BMW M4 Competition Dark", category: "boys", format: "pc", price: 10, code: "M4DARK", img: "https://images.unsplash.com/photo-1555215695-3004980ad54e?auto=format&fit=crop&w=1200&q=80" },
            { id: 2, title: "Neon Cyberpunk Girl", category: "girls", format: "phone", price: 10, code: "NEONGIRL", img: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=800&q=80" },
            { id: 3, title: "BMW M5 Supercar Night", category: "boys", format: "phone", price: 10, code: "M5NIGHT", img: "https://images.unsplash.com/photo-1617814076367-b759c7d7e738?auto=format&fit=crop&w=800&q=80" },
            { id: 4, title: "Minimalist Pastel Clouds", category: "girls", format: "pc", price: 10, code: "PASTEL4K", img: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1200&q=80" },
            { id: 5, title: "Cyberpunk Gaming Rig", category: "boys", format: "pc", price: 10, code: "RIG4K", img: "https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=1200&q=80" },
            { id: 6, title: "Aesthetic Anime Sunset", category: "girls", format: "phone", price: 10, code: "SUNSET4K", img: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80" },
            { id: 7, title: "BMW M5 CS Green Beast", category: "boys", format: "phone", price: 10, code: "M5GREEN", img: "https://images.unsplash.com/photo-1580273916550-e323be2ae537?auto=format&fit=crop&w=800&q=80" },
            { id: 8, title: "Soft Pastel Cloudscape", category: "girls", format: "phone", price: 10, code: "CLOUD4K", img: "https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=800&q=80" },
            { id: 9, title: "BMW M4 Drift Smoke 4K", category: "boys", format: "pc", price: 10, code: "M4DRIFT", img: "https://images.unsplash.com/photo-1603584173870-7f23fdae1b7a?auto=format&fit=crop&w=1200&q=80" },
            { id: 10, title: "Cozy Lofi Room Aesthetic", category: "girls", format: "pc", price: 10, code: "LOFIROOM", img: "https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=1200&q=80" },
            { id: 11, title: "Cyberpunk Neon Samurai", category: "boys", format: "phone", price: 10, code: "SAMURAI", img: "https://images.unsplash.com/photo-1578632767115-351597cf2477?auto=format&fit=crop&w=800&q=80" },
            { id: 12, title: "Sakura Anime Street 4K", category: "girls", format: "phone", price: 10, code: "SAKURA4K", img: "https://images.unsplash.com/photo-1528164344705-475426879e0d?auto=format&fit=crop&w=800&q=80" },
            { id: 13, title: "Supercar Sunset Highway", category: "boys", format: "pc", price: 10, code: "SUPERCAR", img: "https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=1200&q=80" },
            { id: 14, title: "Celestial Galaxy & Moon", category: "girls", format: "pc", price: 10, code: "GALAXY4K", img: "https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?auto=format&fit=crop&w=1200&q=80" },
            { id: 15, title: "Futuristic Neon Setup", category: "boys", format: "phone", price: 10, code: "NEONSETUP", img: "https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=800&q=80" },
            { id: 16, title: "Cyberpunk Girl Neon Rain", category: "girls", format: "pc", price: 10, code: "NEONRAIN", img: "https://images.unsplash.com/photo-1514565131-fce0801e5785?auto=format&fit=crop&w=1200&q=80" },
            { id: 17, title: "BMW M4 Competition Red", category: "boys", format: "pc", price: 10, code: "M4RED4K", img: "https://images.unsplash.com/photo-1580273916550-e323be2ae537?auto=format&fit=crop&w=1200&q=80" },
            { id: 18, title: "Aesthetic Anime Rain Girl", category: "girls", format: "phone", price: 10, code: "RAINGIRL", img: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=800&q=80" },
            { id: 19, title: "BMW M5 CS Frozen Green", category: "boys", format: "pc", price: 10, code: "M5FROZEN", img: "https://images.unsplash.com/photo-1617814076367-b759c7d7e738?auto=format&fit=crop&w=1200&q=80" },
            { id: 20, title: "Minimalist Aesthetic Sunset", category: "girls", format: "phone", price: 10, code: "MINISUN", img: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80" },
            { id: 21, title: "Cyberpunk City Lights 4K", category: "boys", format: "phone", price: 10, code: "CYBERCITY", img: "https://images.unsplash.com/photo-1514565131-fce0801e5785?auto=format&fit=crop&w=800&q=80" },
            { id: 22, title: "Cozy Anime Window View", category: "girls", format: "pc", price: 10, code: "ANIMEWIN", img: "https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=1200&q=80" },
            { id: 23, title: "BMW M4 GT3 Track Edition", category: "boys", format: "phone", price: 10, code: "M4TRACK", img: "https://images.unsplash.com/photo-1555215695-3004980ad54e?auto=format&fit=crop&w=800&q=80" },
            { id: 24, title: "Pastel Galaxy Aesthetic", category: "girls", format: "phone", price: 10, code: "PASTELGAL", img: "https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=800&q=80" },
            { id: 25, title: "Neon Gaming Desk Setup", category: "boys", format: "pc", price: 10, code: "NEONDESK", img: "https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=1200&q=80" },
            { id: 26, title: "Aesthetic Blossom Night", category: "girls", format: "pc", price: 10, code: "BLOSSOM", img: "https://images.unsplash.com/photo-1528164344705-475426879e0d?auto=format&fit=crop&w=1200&q=80" }
        ];

        function isUnlocked(id) {
            return localStorage.getItem(`unlocked_wall_${id}`) === 'true';
        }

        function renderGallery() {
            const grid = document.getElementById('wallpaperGrid');
            const filtered = wallpapers.filter(w => {
                const matchCat = currentCategory === 'all' || w.category === currentCategory;
                const matchFmt = currentFormat === 'all' || w.format === currentFormat;
                return matchCat && matchFmt;
            });

            grid.innerHTML = filtered.map(w => {
                const unlocked = isUnlocked(w.id);
                return `
                    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden group flex flex-col justify-between">
                        <div class="relative ${w.format === 'phone' ? 'aspect-[9/16]' : 'aspect-video'} bg-zinc-950 overflow-hidden">
                            <img src="${w.img}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                            ${!unlocked ? `
                                <div class="absolute inset-0 watermark-overlay flex flex-col items-center justify-center p-4 text-center">
                                    <span class="bg-black/70 backdrop-blur-md text-white font-extrabold text-[10px] px-3 py-1 rounded-full border border-white/20 uppercase tracking-widest mb-1">
                                        <i class="fa-solid fa-lock mr-1"></i> Preview Only
                                    </span>
                                </div>
                            ` : `
                                <div class="absolute top-3 right-3 bg-indigo-600 text-white text-[10px] font-extrabold px-2.5 py-1 rounded-full shadow-lg">
                                    <i class="fa-solid fa-circle-check mr-1"></i> Unlocked
                                </div>
                            `}
                        </div>

                        <div class="p-4 space-y-3">
                            <div class="flex items-start justify-between gap-2">
                                <div>
                                    <h3 class="text-xs font-bold text-white">${w.title}</h3>
                                    <span class="text-[10px] text-zinc-500 uppercase font-mono tracking-wider">${w.category} • ${w.format.toUpperCase()}</span>
                                </div>
                                <span class="text-xs font-black text-indigo-400">₹${w.price}</span>
                            </div>

                            ${unlocked ? `
                                <a href="${w.img}" download="${w.title}-4K.jpg" target="_blank" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs py-2.5 rounded-xl transition flex items-center justify-center space-x-2">
                                    <i class="fa-solid fa-download"></i>
                                    <span>Download 4K Image</span>
                                </a>
                            ` : `
                                <button onclick="openPayModal(${w.id})" class="w-full bg-zinc-800 hover:bg-indigo-600 text-white font-bold text-xs py-2.5 rounded-xl transition border border-zinc-700 flex items-center justify-center space-x-2">
                                    <i class="fa-solid fa-unlock"></i>
                                    <span>Unlock 4K for ₹${w.price}</span>
                                </button>
                            `}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('[id^="cat"]').forEach(btn => btn.className = 'px-4 py-2 rounded-xl text-xs font-bold bg-zinc-900 text-zinc-400 hover:text-white border border-zinc-800 transition');
            document.getElementById(`cat${cat.charAt(0).toUpperCase() + cat.slice(1)}`).className = 'px-4 py-2 rounded-xl text-xs font-bold bg-indigo-600 text-white transition';
            renderGallery();
        }

        function filterFormat(fmt) {
            currentFormat = fmt;
            document.querySelectorAll('[id^="fmt"]').forEach(btn => btn.className = 'px-3 py-1.5 rounded-lg text-xs font-bold text-zinc-400 hover:text-white');
            document.getElementById(`fmt${fmt.charAt(0).toUpperCase() + fmt.slice(1)}`).className = 'px-3 py-1.5 rounded-lg text-xs font-bold bg-zinc-800 text-white';
            renderGallery();
        }

        function openPayModal(id) {
            activeWallId = id;
            const wall = wallpapers.find(w => w.id === id);
            document.getElementById('modalWallTitle').innerText = wall.title;

            const upiUri = `upi://pay?pa=${UPI_ID}&pn=WallPaperVault&am=${wall.price}&cu=INR`;
            document.getElementById('upiPayBtn').href = upiUri;
            document.getElementById('upiQrImg').src = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(upiUri)}`;

            document.getElementById('payModal').classList.remove('hidden');
        }

        function closePayModal() {
            document.getElementById('payModal').classList.add('hidden');
            document.getElementById('utrInput').value = '';
            document.getElementById('passcodeInput').value = '';
        }

        function sendUtrToWhatsapp() {
            const utr = document.getElementById('utrInput').value.trim();
            if (utr.length < 6) {
                alert("Please enter your UTR/Transaction ID first.");
                return;
            }
            const wall = wallpapers.find(w => w.id === activeWallId);
            const msg = `Hi! I paid ₹${wall.price} for wallpaper: "${wall.title}". My UTR is: ${utr}. Please send me the unlock passcode.`;
            const waUrl = `https://wa.me/${PHONE_NUMBER}?text=${encodeURIComponent(msg)}`;
            window.open(waUrl, '_blank');
        }

        function verifyPasscode() {
            const enteredCode = document.getElementById('passcodeInput').value.trim().toUpperCase();
            const currentWall = wallpapers.find(w => w.id === activeWallId);

            if (enteredCode === currentWall.code) {
                localStorage.setItem(`unlocked_wall_${activeWallId}`, 'true');
                closePayModal();
                renderGallery();
                alert("🎉 Passcode Verified! 4K Wallpaper Unlocked!");
            } else {
                alert("❌ Invalid Passcode for this wallpaper. Please check your WhatsApp message.");
            }
        }

        renderGallery();
    </script>
</body>
</html>
