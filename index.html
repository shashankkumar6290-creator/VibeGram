<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aether AI Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-950/50 backdrop-blur-md sticky top-0 z-10">
        <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">
            Aether AI Intelligence
        </h1>
        <button id="openSettingsBtn" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 transition">
            ⚙️ Settings / API Key
        </button>
    </header>

    <!-- Main Chat Window -->
    <main id="chatContainer" class="flex-1 p-4 overflow-y-auto space-y-4 max-w-4xl w-full mx-auto">
        <div id="welcomeMessage" class="bg-slate-800/50 p-4 rounded-xl border border-slate-700 text-slate-300 text-sm">
            Welcome to Aether AI. Ensure you have saved your Gemini API Key starting with <code class="bg-slate-900 px-1.5 py-0.5 rounded text-blue-400">AIzaSy...</code> in the Settings menu above to begin.
        </div>
    </main>

    <!-- Settings Modal -->
    <div id="settingsModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <h2 class="text-lg font-bold text-white">Gemini API Configuration</h2>
            <p class="text-xs text-slate-400">
                Enter your standard Gemini API key starting with <span class="text-blue-400 font-mono">AIzaSy...</span> from 
                <a href="https://aistudio.google.com/app/apikey" target="_blank" class="text-blue-400 underline">Google AI Studio</a>.
            </p>
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">API KEY</label>
                <input 
                    type="password" 
                    id="apiKeyInput" 
                    placeholder="AIzaSy..." 
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500 font-mono"
                />
            </div>
            <div id="modalError" class="text-xs text-rose-400 hidden"></div>
            <div class="flex justify-end gap-2 pt-2">
                <button id="closeSettingsBtn" class="px-4 py-2 text-xs rounded-lg text-slate-300 hover:bg-slate-700">Cancel</button>
                <button id="saveApiKeyBtn" class="px-4 py-2 text-xs bg-blue-600 hover:bg-blue-500 font-semibold rounded-lg text-white">Save Key</button>
            </div>
        </div>
    </div>

    <!-- Input Footer -->
    <footer class="p-4 border-t border-slate-800 max-w-4xl w-full mx-auto">
        <form id="chatForm" class="flex gap-2">
            <input 
                type="text" 
                id="userInput" 
                placeholder="Ask Aether anything..." 
                class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500 text-sm"
                required
            />
            <button 
                type="submit" 
                class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded-lg text-sm font-medium transition-colors"
            >
                Send
            </button>
        </form>
    </footer>

    <!-- Application Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const chatContainer = document.getElementById('chatContainer');
            const chatForm = document.getElementById('chatForm');
            const userInput = document.getElementById('userInput');
            const settingsModal = document.getElementById('settingsModal');
            const openSettingsBtn = document.getElementById('openSettingsBtn');
            const closeSettingsBtn = document.getElementById('closeSettingsBtn');
            const saveApiKeyBtn = document.getElementById('saveApiKeyBtn');
            const apiKeyInput = document.getElementById('apiKeyInput');
            const modalError = document.getElementById('modalError');

            // Default fallback key (hardcoded) or stored key
            let activeApiKey = localStorage.getItem('AETHER_GEMINI_KEY') || "";

            if (activeApiKey) {
                apiKeyInput.value = activeApiKey;
            }

            // Modal Controls
            openSettingsBtn.addEventListener('click', () => {
                settingsModal.classList.remove('hidden');
                modalError.classList.add('hidden');
            });

            closeSettingsBtn.addEventListener('click', () => {
                settingsModal.classList.add('hidden');
            });

            saveApiKeyBtn.addEventListener('click', () => {
                const val = apiKeyInput.value.trim();
                if (!val) {
                    modalError.textContent = "Please enter a valid API key.";
                    modalError.classList.remove('hidden');
                    return;
                }
                if (val.startsWith("AQ.")) {
                    modalError.textContent = "Warning: Keys starting with 'AQ.' are OAuth tokens and will fail. Please use an 'AIzaSy...' key from Google AI Studio.";
                    modalError.classList.remove('hidden');
                    return;
                }
                activeApiKey = val;
                localStorage.setItem('AETHER_GEMINI_KEY', val);
                settingsModal.classList.add('hidden');
            });

            function appendMessage(role, text) {
                const msgDiv = document.createElement('div');
                msgDiv.className = role === 'user' 
                    ? "bg-blue-600/30 border border-blue-500/30 p-4 rounded-xl text-white ml-auto max-w-[85%]"
                    : "bg-slate-800 p-4 rounded-xl text-slate-200 border border-slate-700 max-w-[85%]";
                
                const contentDiv = document.createElement('div');
                contentDiv.className = "prose prose-invert max-w-none text-sm leading-relaxed";
                contentDiv.innerHTML = role === 'assistant' ? marked.parse(text) : text;
                
                msgDiv.appendChild(contentDiv);
                chatContainer.appendChild(msgDiv);
                chatContainer.scrollTop = chatContainer.scrollHeight;
                return msgDiv;
            }

            async function generateText(prompt) {
                const currentKey = activeApiKey || localStorage.getItem('AETHER_GEMINI_KEY');

                if (!currentKey) {
                    appendMessage('assistant', '⚠️ **No API Key Configured.** Please click the **⚙️ Settings / API Key** button at the top right, paste your `AIzaSy...` key from [Google AI Studio](https://aistudio.google.com/app/apikey), and click Save.');
                    return;
                }

                if (currentKey.startsWith("AQ.")) {
                    appendMessage('assistant', '❌ **Invalid Key Type Detected.** Your current key starts with `AQ...` (OAuth Token), which Google rejects on direct REST calls. Please open **⚙️ Settings** and use a standard Gemini API key starting with `AIzaSy...`.');
                    return;
                }

                const loadingDiv = appendMessage('assistant', 'Thinking...');
                const proseContainer = loadingDiv.querySelector('.prose');

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${currentKey}`, {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json' 
                        },
                        body: JSON.stringify({ 
                            contents: [{ parts: [{ text: prompt }] }] 
                        })
                    });

                    const data = await response.json();

                    if (data.error) {
                        throw new Error(data.error.message || "Failed to communicate with Google API.");
                    }

                    const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "No response text generated.";
                    proseContainer.innerHTML = marked.parse(reply);

                } catch (err) {
                    proseContainer.innerHTML = `<span class="text-rose-400 font-semibold">Error: ${err.message}</span>`;
                }
            }

            chatForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const text = userInput.value.trim();
                if (!text) return;
                
                appendMessage('user', text);
                userInput.value = '';
                generateText(text);
            });
        });
    </script>
</body>
</html>
